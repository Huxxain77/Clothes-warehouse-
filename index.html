<style>
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable=true]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

:root{color-scheme:light;--bg:#F1ECE2;--surf:#FFFBF2;--surf2:#EAE1CF;--brd:#D9CCB0;--gold:#9A6A1C;--gold2:#C08A2E;--txt:#2A2318;--mut:#75684F;--grn:#1E7F46;--red:#B83228;--on:#FFF8E8;--gold-rgb:154,106,28;--ink-rgb:42,35,24;--brd-rgb:217,204,176;--sh-rgb:80,55,15;}
html{background:var(--bg);overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;direction:rtl}
.hdr{background:var(--surf);border-bottom:1px solid var(--brd);padding:0 1.5rem;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 4px 20px rgba(var(--sh-rgb),.17)}
.bc{display:none;align-items:center;gap:6px;font-size:.83rem;color:var(--mut)}
.bc .hl{color:var(--gold);font-weight:700}
.bc .arr{opacity:.4}
.bc .back{cursor:pointer;transition:color .2s}
.bc .back:hover{color:var(--gold)}
.cloud-badge{font-size:.72rem;padding:3px 8px;border-radius:8px;font-weight:600;background:rgba(74,222,128,.12);color:var(--grn);border:1px solid rgba(74,222,128,.25);transition:all .3s}
.cloud-badge.warn{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.25)}
.cloud-badge.sync{background:rgba(var(--gold-rgb),.12);color:var(--gold);border-color:rgba(var(--gold-rgb),.25)}
.pg{display:none}.pg.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.home-wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.home-hero{text-align:center;padding:1.5rem 0 2rem}
.home-sub{color:var(--mut);font-size:.85rem;margin-top:.3rem}
.home-actions{display:flex;gap:.75rem;margin-bottom:1.6rem;justify-content:center;flex-wrap:wrap}
.add-yr-bar{display:none;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--surf);border:1px dashed var(--brd);border-radius:13px;padding:.9rem 1.3rem;margin-bottom:1.4rem}
.add-yr-bar.on{display:flex}
.add-yr-bar span{color:var(--mut);font-size:.85rem;flex:1}
.add-yr-bar input{background:var(--surf2);border:1px solid var(--brd);border-radius:9px;padding:.52rem .9rem;color:var(--txt);font-family:'Cairo',sans-serif;font-size:.9rem;outline:none;width:130px;text-align:center;transition:border-color .2s}
.add-yr-bar input:focus{border-color:var(--gold)}
.srch-bar{display:none;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--surf);border:1px solid var(--brd);border-radius:13px;padding:.9rem 1.3rem;margin-bottom:1.4rem}
.srch-bar.on{display:flex}
.srch-box-wrap{position:relative;flex:1;min-width:200px}
.srch-inner{display:flex;align-items:center;gap:.45rem;background:var(--surf2);border:1px solid var(--brd);border-radius:9px;padding:.52rem .9rem;transition:border-color .2s}
.srch-inner:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.1)}
.srch-inner input{background:none;border:none;outline:none;color:var(--txt);font-family:'Cairo',sans-serif;font-size:16px;width:100%;direction:rtl}
.srch-inner input::placeholder{color:var(--mut)}
.ac-drop{position:absolute;top:calc(100% + 5px);right:0;left:0;background:var(--surf);border:1px solid var(--brd);border-radius:11px;box-shadow:0 10px 35px rgba(var(--sh-rgb),.22);z-index:80;overflow-y:auto;max-height:280px;display:none}
.ac-drop.on{display:block}
.ac-item{padding:.65rem 1rem;font-size:.87rem;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;border-bottom:1px solid rgba(var(--brd-rgb),.4);transition:background .15s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.hi{background:var(--surf2)}
.ac-item mark{background:rgba(var(--gold-rgb),.27);color:var(--gold);padding:0;border-radius:3px;display:inline;}
.ac-item-name{font-size:.9rem;font-weight:700;color:var(--txt)}
.ac-item-meta{display:flex;gap:.4rem;flex-wrap:wrap}
.ac-badge{font-size:.72rem;padding:3px 8px;border-radius:8px;font-weight:700;flex-shrink:0}
.b-yr{background:rgba(var(--gold-rgb),.15);color:var(--gold);border:1px solid rgba(var(--gold-rgb),.25)}
.b-row{background:rgba(var(--ink-rgb),.06);color:var(--mut)}
select.yr-sel{background:var(--surf2);border:1px solid var(--brd);border-radius:9px;padding:.52rem .9rem;color:var(--txt);font-family:'Cairo',sans-serif;font-size:.85rem;outline:none;cursor:pointer}
.yr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem}
.yr-card{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:1.5rem 1.5rem 2.2rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;min-height:150px}
.yr-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 36px rgba(var(--sh-rgb),.18)}
.yc-yr{font-family:'Tajawal',sans-serif;font-size:1.8rem;font-weight:900;color:var(--gold);line-height:1;margin-bottom:.5rem}
.yc-tot{font-size:.82rem;color:var(--mut);margin-bottom:.85rem}
.yc-tot strong{color:var(--txt);font-size:.92rem}
.yc-tags{display:flex;gap:.45rem;flex-wrap:wrap}
.yc-tag{font-size:.76rem;padding:4px 10px;border-radius:8px;font-weight:700;white-space:nowrap;color:#fff}
.yc-arrow{position:absolute;bottom:.9rem;left:.9rem;color:var(--mut);transition:all .2s}
.yr-card:hover .yc-arrow{color:var(--gold);transform:translateX(-4px)}
.yc-del{position:absolute;top:.75rem;left:.75rem;background:none;border:none;color:var(--mut);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:.83rem;transition:all .2s;opacity:0}
.yr-card:hover .yc-del{opacity:1}
.yc-del:hover{background:rgba(248,113,113,.18);color:var(--red)}
.empty-home{text-align:center;padding:3rem 1rem;color:var(--mut)}
.empty-home .big{font-size:3rem;opacity:.2;margin-bottom:.5rem}
.yr-wrap{max-width:1280px;margin:0 auto;padding:1.4rem 1.5rem 3rem}
.yr-bar{display:flex;align-items:center;gap:.7rem;margin-bottom:1.3rem;flex-wrap:wrap}
.yr-sbox{position:relative;flex:1;min-width:200px}
.yr-sinner{display:flex;align-items:center;gap:.45rem;background:var(--surf);border:1px solid var(--brd);border-radius:11px;padding:.53rem 1rem;transition:border-color .2s}
.yr-sinner:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.1)}
.yr-sinner input{background:none;border:none;outline:none;color:var(--txt);font-family:'Cairo',sans-serif;font-size:16px;width:100%;direction:rtl}
.yr-sinner input::placeholder{color:var(--mut)}
.yr-ac{position:absolute;top:calc(100% + 5px);right:0;left:0;background:var(--surf);border:1px solid var(--brd);border-radius:11px;box-shadow:0 10px 35px rgba(var(--sh-rgb),.22);z-index:80;overflow-y:auto;max-height:280px;display:none}
.yr-ac.on{display:block}
.stats-row{display:flex;gap:.85rem;margin-bottom:1.3rem;flex-wrap:wrap}
.sc{background:var(--surf);border:1px solid var(--brd);border-radius:13px;padding:.75rem 1.15rem;display:flex;align-items:center;gap:.6rem;flex:1;min-width:110px}
.sc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sc-lbl{font-size:.74rem;color:var(--mut)}
.sc-val{font-size:1.28rem;font-weight:900;font-family:'Tajawal',sans-serif;line-height:1}
.col-chip{display:inline-flex;align-items:center;gap:.3rem;padding:3px 8px;border-radius:20px;font-size:.75rem;font-weight:700;border:1px solid}
.tbl-card{background:var(--surf);border:1px solid var(--brd);border-radius:15px;overflow:hidden;box-shadow:0 8px 30px rgba(var(--sh-rgb),.19)}
.tbl-card-header{display:flex;justify-content:space-between;align-items:center;padding:.5rem .8rem .2rem}
.btn-expand{background:var(--surf2);border:1px solid var(--brd);border-radius:8px;color:var(--mut);cursor:pointer;font-size:1.1rem;padding:4px 10px;transition:all .2s;line-height:1}
.btn-expand:hover{background:var(--brd);color:var(--txt)}
.tbl-card.fullscreen{position:fixed;inset:0;z-index:150;border-radius:0;margin:0;display:flex;flex-direction:column;background:var(--surf)}
.tbl-card.fullscreen .tbl-scroll{flex:1;overflow:auto}
.tbl-card.fullscreen .btn-expand{font-size:1.2rem;color:var(--gold)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:400px;direction:rtl}
thead tr{background:var(--surf2)}
th{padding:.8rem .95rem;font-size:.79rem;font-weight:700;color:#fff;text-align:center;border-bottom:1px solid var(--brd);white-space:nowrap}
th.th-num{color:var(--mut);background:transparent}
tbody tr{border-bottom:1px solid rgba(var(--brd-rgb),.45);transition:background .14s}
tbody tr:hover{background:rgba(var(--ink-rgb),.02)}
tbody tr:last-child{border-bottom:none}
tbody tr.dim{opacity:.22}
td{padding:.6rem .95rem;text-align:center;font-size:.87rem;vertical-align:middle}
td.tn{color:var(--mut);font-size:.75rem;width:40px}
.ci{display:inline-flex;align-items:center;gap:.3rem;padding:3px 7px;border-radius:7px;cursor:pointer;transition:background .14s;min-width:72px;justify-content:center}
.ci:hover{background:var(--surf2)}
.edi{opacity:0;font-size:.66rem;color:var(--mut);transition:opacity .14s}
.ci:hover .edi{opacity:1}
.emp{color:var(--mut);opacity:.35;font-size:.77rem}
.ci-inp{background:var(--surf2);border:1.5px solid var(--gold);border-radius:7px;padding:3px 7px;color:var(--txt);font-family:'Cairo',sans-serif;font-size:.87rem;text-align:center;outline:none;width:100%;min-width:72px;direction:rtl;box-shadow:0 0 0 3px rgba(var(--gold-rgb),.11)}
.copy-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.8rem;padding:2px 5px;border-radius:5px;transition:all .18s;opacity:0;flex-shrink:0}
tr:hover .copy-btn{opacity:1}
.copy-btn:hover{background:rgba(var(--gold-rgb),.15);color:var(--gold)}
.del-r{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.87rem;padding:3px 5px;border-radius:6px;transition:all .2s;opacity:0}
tr:hover .del-r{opacity:1}
.del-r:hover{background:rgba(248,113,113,.16);color:var(--red)}
.tbl-empty{padding:2.8rem;text-align:center;color:var(--mut)}
.tbl-empty .ico{font-size:2rem;opacity:.2;margin-bottom:.4rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.57rem 1.1rem;border-radius:11px;border:none;font-family:'Cairo',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--on)}
.btn-g:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(var(--gold-rgb),.28)}
.btn-s{background:var(--surf2);color:var(--txt);border:1px solid var(--brd)}
.btn-s:hover{background:var(--brd)}
.btn-sm{padding:.32rem .7rem;font-size:.79rem;border-radius:8px}
.ov{position:fixed;inset:0;background:rgba(var(--ink-rgb),.45);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fov .18s ease}
@keyframes fov{from{opacity:0}to{opacity:1}}
.modal{background:var(--surf);border:1px solid var(--brd);border-radius:19px;padding:1.8rem;width:90%;max-width:440px;box-shadow:0 18px 55px rgba(var(--sh-rgb),.28);animation:mup .2s ease;direction:rtl;max-height:90vh;overflow-y:auto}
@keyframes mup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{font-family:'Tajawal',sans-serif;font-size:1.12rem;font-weight:700;margin-bottom:1.2rem;color:var(--gold);display:flex;align-items:center;gap:.4rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:.79rem;font-weight:600;color:var(--mut);margin-bottom:.3rem}
.fc{width:100%;background:var(--surf2);border:1px solid var(--brd);border-radius:9px;padding:.6rem .95rem;color:var(--txt);font-family:'Cairo',sans-serif;font-size:16px;outline:none;transition:border-color .2s;direction:rtl}
.fc:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.1)}
.col-picker{display:flex;gap:.42rem;flex-wrap:wrap}
.co{display:flex;align-items:center;gap:.38rem;padding:.55rem .85rem;border:2px solid var(--brd);border-radius:9px;cursor:pointer;transition:all .17s;font-size:.79rem;font-weight:600;color:var(--txt)}
.co:hover{opacity:.85}
.co.sel{opacity:1}
.added-log{display:none;align-items:center;gap:.4rem;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.23);color:var(--grn);border-radius:8px;padding:5px 10px;font-size:.81rem;font-weight:700;margin-top:.75rem}
.added-log.on{display:flex}
.mfoot{display:flex;gap:.55rem;justify-content:flex-end;margin-top:1.2rem}
.col-list-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--surf2);border-radius:9px;margin-bottom:.4rem}
.col-list-item input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:'Cairo',sans-serif;font-size:.88rem;direction:rtl}
.col-list-item .del-col-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.9rem;padding:2px 4px;border-radius:5px;transition:all .18s;flex-shrink:0}
.col-list-item .del-col-btn:hover{color:var(--red);background:rgba(248,113,113,.15)}
.toast{position:fixed;bottom:1.7rem;left:50%;transform:translateX(-50%) translateY(65px);background:var(--surf2);border:1px solid var(--brd);border-radius:11px;padding:.65rem 1.35rem;font-size:.86rem;font-weight:600;z-index:300;transition:transform .27s ease, opacity .27s ease;box-shadow:0 8px 28px rgba(var(--sh-rgb),.22);pointer-events:none;opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:rgba(74,222,128,.38);color:var(--grn)}
.toast.er{border-color:rgba(248,113,113,.38);color:var(--red)}

/* TODAY SECTION */
.today-section{background:var(--surf);border:1px solid rgba(var(--gold-rgb),.3);border-radius:15px;padding:1.2rem 1.4rem;margin-bottom:1.3rem}
.today-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.today-title{font-family:'Tajawal',sans-serif;font-weight:700;font-size:1rem;color:var(--gold)}
.today-count{background:rgba(var(--gold-rgb),.15);color:var(--gold);border:1px solid rgba(var(--gold-rgb),.3);padding:2px 10px;border-radius:20px;font-size:.8rem;font-weight:700}
.today-list{display:flex;flex-wrap:wrap;gap:.4rem;max-height:140px;overflow-y:auto;padding-right:.2rem}
.today-chip{display:inline-flex;align-items:center;gap:.4rem;padding:4px 10px;border-radius:20px;font-size:.82rem;font-weight:600;color:#fff}
.today-empty{color:var(--mut);font-size:.84rem;text-align:center;padding:.5rem}
@media(max-width:600px){.home-wrap,.yr-wrap{padding:1rem}.yr-bar{flex-direction:column;align-items:stretch}}

/* BOTTOM NAV BAR — floating dark pill (Instagram style) */
.bottom-nav-wrap{position:fixed;bottom:calc(1.7rem + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;z-index:95;padding:0 1rem;pointer-events:none}
.bottom-nav{
  display:flex;align-items:center;justify-content:space-between;gap:.25rem;
  width:min(100%,330px);padding:.4rem;border-radius:999px;pointer-events:auto;
  background:rgba(43,36,24,.94);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 10px 26px rgba(80,55,15,.35),0 2px 6px rgba(80,55,15,.2);
}
.bn-item{
  flex:1;height:50px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:999px;color:#F6EFDD;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .25s ease,transform .15s ease;
}
.bn-item svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .2s}
.bn-item:active{transform:scale(.92)}
.bn-item.active{background:rgba(255,255,255,.16)}
.bn-item.active svg{stroke-width:2.6}
body.has-bottom-nav .home-wrap{padding-bottom:5rem}
/* ADD MODAL: يبقى فوق لوحة المفاتيح وزر الإضافة ظاهر */
#addOv{align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + .6rem)}
#addOv .modal{padding:1.2rem 1.4rem;max-height:100%}
#addOv .modal h2{margin-bottom:.8rem}
#addOv .fg{margin-bottom:.75rem}
#addOv .mfoot{margin-top:.8rem}
.fc[type=search]{-webkit-appearance:none;appearance:none}
.fc[type=search]::-webkit-search-cancel-button,.fc[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
/* UNDO + DUPLICATE WARNING */
.undo-chip{width:32px;height:32px;border-radius:50%;border:1px solid var(--brd);background:var(--surf2);color:var(--gold);font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.undo-chip[hidden]{display:none}
.undo-chip:active{transform:scale(.9)}
.undo-bar{position:fixed;left:50%;bottom:calc(1.7rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);opacity:0;pointer-events:none;z-index:301;
  display:flex;align-items:center;gap:.9rem;background:var(--surf2);border:1px solid rgba(248,113,113,.38);border-radius:12px;padding:.5rem .6rem .5rem 1rem;
  font-size:.86rem;font-weight:600;color:var(--red);box-shadow:0 8px 28px rgba(var(--sh-rgb),.25);transition:transform .27s ease,opacity .27s ease;max-width:calc(100vw - 2rem)}
.undo-bar.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.undo-bar button{background:var(--gold);color:var(--on);border:none;border-radius:8px;padding:.35rem .9rem;font-family:'Cairo',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer}
body.has-bottom-nav .undo-bar{bottom:calc(7.4rem + env(safe-area-inset-bottom,0px))}
.dup-box{display:none;margin-top:.45rem;padding:.45rem .7rem;border-radius:8px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);font-size:.8rem;font-weight:600;line-height:1.7}
.dup-box.on{display:block}
.dup-box.flash{animation:dupFlash .45s}
@keyframes dupFlash{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* UPDATE BADGE — small floating icon above the nav */
#updBtn{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(6.3rem + env(safe-area-inset-bottom,0px));height:40px;padding:0 1.15rem 0 1rem;border-radius:999px;
  display:flex;align-items:center;gap:.5rem;cursor:pointer;z-index:96;border:none;font-family:'Cairo',sans-serif;font-weight:700;font-size:.86rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--on);filter:drop-shadow(0 6px 14px rgba(var(--sh-rgb),.28));
  -webkit-tap-highlight-color:transparent;animation:updIn .4s cubic-bezier(.2,.8,.2,1),updPulse 2.2s ease-out .6s infinite}
#updBtn[hidden]{display:none}
#updBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#updBtn.busy svg{animation:updSpin 1s linear infinite}
#updBtn:active{transform:scale(.95)}
body:not(.has-bottom-nav) #updBtn{bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
@keyframes updSpin{to{transform:rotate(360deg)}}
@keyframes updIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes updPulse{0%{box-shadow:0 0 0 0 rgba(232,201,142,.65)}100%{box-shadow:0 0 0 12px rgba(232,201,142,0)}}
@media print{#updBtn{display:none!important}}
</style>

    var target=document.getElementById("pgHome");

    var mo=new MutationObserver(function(){
      if(window.__dataReady && !target.classList.contains("loading")){hide();mo.disconnect();}
    });
    mo.observe(target,{attributes:true,attributeFilter:["class"],childList:true,subtree:false});
    if(window.__dataReady && !target.classList.contains("loading"))hide();

function getName(entry){
  if(!entry) return '';
  if(typeof entry === 'object') return entry.n || '';
  return entry;
}
function getTime(entry){
  if(!entry || typeof entry !== 'object') return 0;
  return entry.t || 0;
}
function isToday(entry){
  var t = getTime(entry);
  if(!t) return false;
  var d = new Date(t), now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function loadDB(){
  cloudBadge("⏳ تحميل...","sync");
  var staleTimer=setTimeout(function(){
    // ما جاوب السيرفر خلال المهلة — اعرض آخر نسخة محفوظة محلياً مع تنبيه إنها قديمة
    loadLocal();
    showStaleBar(true);
    revealHome();
  }, navigator.onLine ? 8000 : 600);

  if(!navigator.onLine){
    // أوفلاين من البداية — لا داعي ننتظر، اعرض المحلي فوراً مع الشريط
    clearTimeout(staleTimer);
    loadLocal();
    cloudBadge("📵 محلي","warn");
    showStaleBar(true);
    revealHome();
    return;
  }

  fetch(FB_URL+"?key="+FB_API_KEY)
    .then(function(r){return r.json();})
    .then(function(doc){
      clearTimeout(staleTimer);
      if(doc&&doc.fields){
        db=fromFS(doc);
        localStorage.setItem("wh3",JSON.stringify(db));
        cloudBadge("☁️ متزامن","");
      } else {
        loadLocal();
        if(Object.keys(db).length>0)pushCloud();
      }
      showStaleBar(false);
      revealHome();
    })
    .catch(function(){
      clearTimeout(staleTimer);
      loadLocal();
      cloudBadge("📵 محلي","warn");
      showStaleBar(true);
      revealHome();
    });

  window.addEventListener("offline",function(){
    if(!__dataReady){clearTimeout(staleTimer);loadLocal();showStaleBar(true);revealHome();}
  });
}
function loadLocal(){try{db=JSON.parse(localStorage.getItem("wh3")||"{}");}catch(e){db={};}}
function saveDB(){
  localStorage.setItem("wh3",JSON.stringify(db));
  clearTimeout(saveTimer);cloudBadge("⏳ حفظ...","sync");
  saveTimer=setTimeout(pushCloud,1500);
}
function pushCloud(){
  fetch(FB_URL+"?key="+FB_API_KEY,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(toFS(db))})
    .then(function(r){if(r.ok){cloudBadge("☁️ محفوظ","");if(window.__mark)__mark('synced');}else cloudBadge("⚠️ خطأ","warn");})
    .catch(function(){cloudBadge("📵 محلي فقط","warn");});
}

      '<div style="width:12px;height:12px;border-radius:50%;background:'+bg+';flex-shrink:0"></div>'+
      '<input type="text" value="'+c.name.replace(/"/g,'&quot;')+'" onblur="renameCol(\''+c.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">'+
      '<button class="del-col-btn" onclick="delCol(\''+c.id+'\')">🗑</button>'+
    '</div>';
  }).join("");
  document.getElementById("colList").innerHTML=html||'<div style="color:var(--mut);font-size:.85rem;text-align:center;padding:.5rem">لا توجد أعمدة</div>';
}
function addCol(){
  var name=document.getElementById("newColName").value.trim();
  if(!name){toast("أدخل اسم العمود","er");return;}
  var d=getYD(CY),id="col_"+Date.now();
  d.cols.push({id:id,name:name});d.rows[id]=[];
  saveDB();renderColList();renderYearPage();
  document.getElementById("newColName").value="";
  toast("تمت إضافة عمود: "+name,"ok");
}
function renameCol(colId,name){
  name=name.trim();if(!name)return;
  var d=getYD(CY),col=d.cols.find(function(c){return c.id===colId;});
  if(col&&col.name!==name){col.name=name;saveDB();renderColChips();renderTable(document.getElementById("yrSrch").value.trim());renderStats();toast("تم تعديل اسم العمود","ok");}
}
function delCol(colId){
  var d=getYD(CY);
  if(d.cols.length<=1){toast("لازم يبقى عمود واحد على الأقل","er");return;}
  var col=d.cols.find(function(c){return c.id===colId;});
  if(!confirm('حذف عمود "'+col.name+'" وجميع بياناته؟'))return;
  pushUndo("حذف عمود");
  d.cols=d.cols.filter(function(c){return c.id!==colId;});
  delete d.rows[colId];
  saveDB();renderColList();renderYearPage();
  showUndoBar("تم حذف العمود");
}

function startEdit(el,col,idx){
  if(editInfo)cancelEdit();
  var td=el.parentElement,d=getYD(CY),entry=(d.rows[col]||[])[idx],cur=getName(entry);
  editInfo={td:td,col:col,idx:idx,prev:cur};
  td.innerHTML='<input class="ci-inp" id="eInp" type="text" value="'+cur.replace(/"/g,'&quot;')+'" dir="rtl" autocomplete="off">';
  var inp=document.getElementById("eInp");
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commitEdit();}if(e.key==="Escape")cancelEdit();});
  inp.addEventListener("blur",function(){commitEdit();});
  inp.focus();inp.select();
}
function commitEdit(){
  if(!editInfo)return;
  var inp=document.getElementById("eInp");
  if(!inp){editInfo=null;return;}
  var val=inp.value.trim(),d=getYD(CY);
  if(val!==getName((d.rows[editInfo.col]||[])[editInfo.idx]))pushUndo(val?"تعديل اسم":"مسح اسم");
  if(!d.rows[editInfo.col])d.rows[editInfo.col]=[];
  while(d.rows[editInfo.col].length<=editInfo.idx)d.rows[editInfo.col].push("");
  var oldEntry=d.rows[editInfo.col][editInfo.idx];var oldT=getTime(oldEntry);d.rows[editInfo.col][editInfo.idx]=val?{n:val,t:oldT||Date.now()}:'';
  while(d.rows[editInfo.col].length&&!d.rows[editInfo.col][d.rows[editInfo.col].length-1])d.rows[editInfo.col].pop();
  saveDB();editInfo=null;
  renderTable(document.getElementById("yrSrch").value.trim());renderStats();toast("تم الحفظ ✓","ok");
}
function cancelEdit(){
  if(!editInfo)return;
  var info=editInfo;editInfo=null;
  if(info.prev){info.td.innerHTML='<div class="ci" onclick="startEdit(this,\''+info.col+'\','+info.idx+')">'+info.prev+'<span class="edi">✏️</span></div>';}
  else{info.td.innerHTML='<div class="ci emp" onclick="startEdit(this,\''+info.col+'\','+info.idx+')">—</div>';}
}
function delRow(idx){
  var d=getYD(CY);pushUndo("حذف صف");
  d.cols.forEach(function(c){if((d.rows[c.id]||[]).length>idx)d.rows[c.id].splice(idx,1);});
  saveDB();renderTable(document.getElementById("yrSrch").value.trim());renderStats();showUndoBar("تم حذف الصف");
}

/* ═══ UNDO (يحفظ نسخة قبل كل تعديل، آخر 15 عملية، في ذاكرة الصفحة فقط) ═══ */
var undoStack=[],undoTimer=null;
function pushUndo(label){
  try{undoStack.push({label:label,snap:JSON.stringify(db)});}catch(e){return;}
  if(undoStack.length>15)undoStack.shift();
  refreshUndoUI();
}
function refreshUndoUI(){
  var chip=document.getElementById("undoChip");
  if(!chip)return;
  chip.hidden=!undoStack.length;
  if(undoStack.length)chip.title="تراجع: "+undoStack[undoStack.length-1].label;
}
function showUndoBar(msg){
  var b=document.getElementById("undoBar");
  document.getElementById("undoMsg").textContent="❌ "+msg;
  b.classList.add("on");
  clearTimeout(undoTimer);undoTimer=setTimeout(hideUndoBar,8000);
}
function hideUndoBar(){var b=document.getElementById("undoBar");if(b)b.classList.remove("on");clearTimeout(undoTimer);}
function doUndo(){
  var it=undoStack.pop();
  if(!it)return;
  editInfo=null;
  try{db=JSON.parse(it.snap);}catch(e){toast("تعذر التراجع","er");return;}
  saveDB();hideUndoBar();refreshUndoUI();
  if(CY&&!db[CY]){goHome();}
  else if(CY){renderYearPage();renderTable(document.getElementById("yrSrch").value.trim());}
  else{renderHome();}
  toast("تم التراجع: "+it.label,"ok");
}

/* ═══ DUPLICATE CHECK ═══ */
var dupAck="";
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function normName(s){
  return String(s||"").toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-1632);})
    .replace(/\s+/g," ").trim();
}
function findDups(name){
  var key=normName(name),res=[];
  if(!key||!CY)return res;
  var d=getYD(CY);
  d.cols.forEach(function(c){
    (d.rows[c.id]||[]).forEach(function(en,i){
      var n=getName(en);
      if(n&&normName(n)===key)res.push({name:n,col:c.name,row:i+1});
    });
  });
  return res;
}
function updateDupBox(){
  var inp=document.getElementById("custInp"),box=document.getElementById("dupBox"),btn=document.getElementById("addBtn");
  var name=inp.value.trim(),dups=name?findDups(name):[];
  if(dupAck&&dupAck!==normName(name))dupAck="";
  if(!dups.length){box.className="dup-box";box.innerHTML="";dupAck="";btn.textContent="إضافة ✓";return dups;}
  box.className="dup-box on";
  box.innerHTML="⚠️ هذا الاسم موجود قبل:"+dups.slice(0,3).map(function(x){return "<div>• "+escHtml(x.name)+" — "+escHtml(x.col)+"، صف "+x.row+"</div>";}).join("")+(dups.length>3?"<div>… و"+(dups.length-3)+" أخرى</div>":"");
  btn.textContent="إضافة رغم التكرار";
  return dups;
}
function getLastCol(){try{return localStorage.getItem("wh_lastcol")||"";}catch(e){return "";}}
function setLastCol(c){try{localStorage.setItem("wh_lastcol",c);}catch(e){}}

var modalReady=false;
function openAdd(){
  selC=null;addedCount=0;
  document.getElementById("custInp").value="";
  document.getElementById("addLog").className="added-log";
  var cols=getCols(CY);
  document.getElementById("colPicker").innerHTML=cols.map(function(c,i){
    var bg=COL_COLORS[i%COL_COLORS.length];
    return '<div class="co" data-c="'+c.id+'" onclick="pickC(this)" style="border-color:'+bg+'44">'+c.name+'</div>';
  }).join("");
  var lc=getLastCol();
  if(lc&&cols.some(function(c){return c.id===lc;})){selC=lc;refreshCol();requestAnimationFrame(refreshCol);}
  dupAck="";updateDupBox();
  document.getElementById("addOv").style.display="flex";fitAddOv();
  if(!modalReady){modalReady=true;document.getElementById("addOv").addEventListener("focusin",function(){if(selC)requestAnimationFrame(refreshCol);});}

}
function closeAdd(){var ov=document.getElementById("addOv");ov.style.display="none";ov.style.top="";ov.style.height="";ov.style.bottom="";}
function fitAddOv(){
  var ov=document.getElementById("addOv"),v=window.visualViewport;
  if(!ov||!v||ov.style.display!=="flex")return;
  ov.style.top=v.offsetTop+"px";ov.style.bottom="auto";ov.style.height=v.height+"px";
}
if(window.visualViewport){window.visualViewport.addEventListener("resize",fitAddOv);window.visualViewport.addEventListener("scroll",fitAddOv);}
function refreshCol(){
  var cols=getCols(CY);
  document.querySelectorAll(".co").forEach(function(o){
    var c=o.getAttribute("data-c"),i=cols.findIndex(function(x){return x.id===c;}),bg=COL_COLORS[i%COL_COLORS.length]||"#888";
    o.className="co";
    if(selC&&c===selC){o.classList.add("sel");o.style.cssText="border-color:"+bg+"!important;background:"+bg+"22!important;color:"+bg+"!important";}
    else{o.style.cssText="border-color:"+bg+"44";}
  });
}
function pickC(el){selC=el.getAttribute("data-c");setLastCol(selC);refreshCol();requestAnimationFrame(refreshCol);document.getElementById("custInp").focus();}
function doAdd(){
  var inp=document.getElementById("custInp"),name=inp.value.trim();
  if(!name){toast("أدخل اسم الزبون","er");inp.focus();return;}
  if(!selC){toast("اختر العمود","er");return;}
  var dups=updateDupBox(),key=normName(name);
  if(dups.length&&dupAck!==key){
    dupAck=key;
    var box=document.getElementById("dupBox");box.classList.remove("flash");void box.offsetWidth;box.classList.add("flash");
    toast("الاسم مكرر — اضغط مرة ثانية للإضافة رغم ذلك","er");inp.focus();return;
  }
  pushUndo("إضافة "+name);
  var d=getYD(CY);
  if(!d.rows[selC])d.rows[selC]=[];
  var entry = {n:name, t:Date.now()};
  d.rows[selC].push(entry);
  setLastCol(selC);
  saveDB();addedCount++;
  var log=document.getElementById("addLog");
  log.className="added-log on";
  log.textContent=addedCount===1?"✅ تمت إضافة: "+name:"✅ آخر إضافة: "+name+" — المجموع "+addedCount;
  inp.value="";updateDupBox();inp.focus();requestAnimationFrame(refreshCol);
  renderTable(document.getElementById("yrSrch").value.trim());renderStats();renderToday();
}

function smartMatch(name,q){if(!q)return true;var w=q.trim().toLowerCase().split(/\s+/).filter(function(x){return x.length>0;});var n=name.toLowerCase();return w.every(function(x){return n.indexOf(x)!==-1;});}
function highlightWords(name,q){
  if(!q) return name;
  var words=q.trim().split(/\s+/).filter(function(w){return w.length>0;});
  var r=name;
  words.forEach(function(w){
    r=r.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  });
  return r;
}
function esc(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\x27");}

function copyToday(){
  var d=getYD(CY),lines=[],total=0;
  var today=new Date();
  lines.push("أُضيفوا اليوم — "+today.getDate()+"/"+(today.getMonth()+1)+"/"+today.getFullYear());
  lines.push("══════════════");
  d.cols.forEach(function(c){
    var names=[];
    (d.rows[c.id]||[]).forEach(function(entry){
      if(isToday(entry))names.push(getName(entry));
    });
    if(names.length){
      lines.push("");
      lines.push("【 "+c.name+" 】");
      names.forEach(function(n,i){lines.push((i+1)+". "+n);});
      total+=names.length;
    }
  });
  if(!total){toast("لا يوجد أسماء اليوم","er");return;}
  var text=lines.join("\n");
  navigator.clipboard.writeText(text).then(function(){
    toast("تم نسخ "+total+" اسم ✓","ok");
  }).catch(function(){
    var ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
    toast("تم نسخ "+total+" اسم ✓","ok");
  });
}

function copyName(name){
  navigator.clipboard.writeText(name).then(function(){
    toast("تم نسخ: "+name,"ok");
  }).catch(function(){
    // fallback
    var ta=document.createElement("textarea");
    ta.value=name;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
    toast("تم نسخ: "+name,"ok");
  });
}

function importExcel(input){
  var file=input.files[0];if(!file)return;
  var yr=file.name.replace(/\.[^.]+$/,"").replace(/[^0-9]/g,"");
  if(!yr||yr<1900||yr>2100){toast("تأكد إن اسم الملف هو السنة مثل: 2025.xlsx","er");input.value="";return;}
  toast("جارِ تجهيز الاستيراد...","ok");
  loadXLSX().then(function(){doImportExcel(file,yr,input);}).catch(function(){toast("تعذّر تحميل مكتبة الاستيراد — تأكد من الإنترنت","er");input.value="";});
}
function doImportExcel(file,yr,input){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      pushUndo("استيراد Excel");
      var d=getYD(yr),added=0;
      for(var i=1;i<rows.length;i++){
        var row=rows[i];
        d.cols.forEach(function(c,ci){
          var val=(row[ci]||"").toString().trim();
          if(val){if(!d.rows[c.id])d.rows[c.id]=[];d.rows[c.id].push({n:val,t:Date.now()});added++;}
        });
      }
      saveDB();renderHome();
      toast("تم استيراد "+added+" إدخال لسنة "+yr+" ✓","ok");
    }catch(err){toast("فشل القراءة — تأكد إن الملف xlsx صحيح","er");}
    input.value="";
  };
  reader.readAsArrayBuffer(file);
}

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
/* فحص النسخة: نقارن نسخة الصفحة الشغالة بنسخة السيرفر (meta app-version في أول الملف)، ونظهر زر "يوجد تحديث" فقط لو اختلفت */
var __vc={t:0,ver:"",err:"",n:0},__vcBusy=false;
function showUpdateBtn(){var b=document.getElementById("updBtn");if(b)b.hidden=false;}
function __vcFetch(range){
  var ctl=("AbortController" in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},8000);
  var opt={cache:"no-store"};
  if(range)opt.headers={"Range":"bytes=0-3071"};
  if(ctl)opt.signal=ctl.signal;
  return fetch("index.html?__vcheck="+Date.now(),opt)
    .then(function(r){clearTimeout(to);if(!r.ok&&r.status!==206)throw new Error("HTTP "+r.status);return r.text();})
    .then(function(t){
      var m=t.match(/name="app-version"\s+content="([^"]+)"/)||t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      if(!m)throw new Error("no version");
      return m[1];
    },function(e){clearTimeout(to);throw e;});
}
function checkUpdate(){
  if(__vcBusy||(__vc.t&&Date.now()-__vc.t<4000))return;
  __vcBusy=true;
  __vcFetch(true).catch(function(){return __vcFetch(false);})
    .then(function(v){__vc.ver=v;__vc.err="";if(v!==APP_VERSION)showUpdateBtn();},function(e){__vc.err=String(e&&e.message||e);})
    .then(function(){__vc.t=Date.now();__vc.n++;__vcBusy=false;});
}
function applyUpdate(){
  var b=document.getElementById("updBtn"),tx=document.getElementById("updTxt");
  if(b)b.classList.add("busy");if(tx)tx.textContent="جارٍ التحديث…";
  var go=function(){location.reload();};
  var clear=(window.caches&&caches.keys)?caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("khayyat-shabab")===0;}).map(function(k){return caches.delete(k);}));}):Promise.resolve();
  clear.then(go,go);
  setTimeout(go,4000);
}
setTimeout(checkUpdate,0);
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate();});
window.addEventListener("pageshow",function(e){if(e.persisted)checkUpdate();});
window.addEventListener("online",checkUpdate);
setInterval(function(){if(!document.hidden)checkUpdate();},45000);
</script>
