<style>
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable=true]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

:root{color-scheme:light;--bg:#F1ECE2;--surf:#FFFBF2;--surf2:#EAE1CF;--brd:#D9CCB0;--gold:#9A6A1C;--gold2:#C08A2E;--txt:#2A2318;--mut:#75684F;--grn:#1E7F46;--red:#B83228;--on:#FFF8E8;--gold-rgb:154,106,28;--ink-rgb:42,35,24;--brd-rgb:217,204,176;--sh-rgb:80,55,15;}
html{background:var(--bg);overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;direction:rtl}
.hdr{background:var(--surf);border-bottom:1px solid var(--brd);padding:0 1.5rem;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 4px 20px rgba(var(--sh-rgb),.17)}
.bc{display:none;align-items:center;gap:6px;font-size:.83rem;color:var(--mut)}
.bc .hl{color:var(--gold);font-weight:700}
.bc .arr{opacity:.4}
.bc .back{cursor:pointer;transition:color .2s}
.bc .back:hover{color:var(--gold)}
.cloud-badge{font-size:.72rem;padding:3px 8px;border-radius:8px;font-weight:600;background:rgba(74,222,128,.12);color:var(--grn);border:1px solid rgba(74,222,128,.25);transition:all .3s}
.cloud-badge.warn{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.25)}
.cloud-badge.sync{background:rgba(var(--gold-rgb),.12);color:var(--gold);border-color:rgba(var(--gold-rgb),.25)}
.pg{display:none}.pg.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.home-wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.home-hero{text-align:center;padding:1.5rem 0 2rem}
.home-sub{color:var(--mut);font-size:.85rem;margin-top:.3rem}
.home-actions{display:flex;gap:.75rem;margin-bottom:1.6rem;justify-content:center;flex-wrap:wrap}

}

<script>
(function(){
  var MAX_MS=15000, start=Date.now(), done=false;
  function hide(){
    if(done)return; done=true;
    var el=document.getElementById("splash");
    if(!el)return;
    if(window.__mark)window.__mark('shown');
    el.classList.add("splash-hide");
    setTimeout(function(){el.remove();},400);
  }
  window.__hideSplash=hide;
  setTimeout(hide,MAX_MS);
  // يراقب حاوية المحتوى الرئيسية؛ يختفي فقط لما البيانات تجهز فعلياً (window.__dataReady)
  function attachObserver(){
    var target=document.getElementById("pgHome");
    if(!target){ if(Date.now()-start<MAX_MS) return setTimeout(attachObserver,50); return hide(); }
    var mo=new MutationObserver(function(){
      if(window.__dataReady && !target.classList.contains("loading")){hide();mo.disconnect();}
    });
    mo.observe(target,{attributes:true,attributeFilter:["class"],childList:true,subtree:false});
    if(window.__dataReady && !target.classList.contains("loading"))hide();
  }
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",attachObserver);}else{attachObserver();}
})();
</script>

function loadXLSX(){

  return xlsxLoadPromise;
}

}

var __dataReady=false, __staleShown=false;

function loadDB(){
  cloudBadge("⏳ تحميل...","sync");
  var staleTimer=setTimeout(function(){
    // ما جاوب السيرفر خلال المهلة — اعرض آخر نسخة محفوظة محلياً مع تنبيه إنها قديمة
    loadLocal();
    showStaleBar(true);
    revealHome();
  }, navigator.onLine ? 8000 : 600);

  if(!navigator.onLine){
    // أوفلاين من البداية — لا داعي ننتظر، اعرض المحلي فوراً مع الشريط
    clearTimeout(staleTimer);
    loadLocal();
    cloudBadge("📵 محلي","warn");
    showStaleBar(true);
    revealHome();
    return;
  }

  fetch(FB_URL+"?key="+FB_API_KEY)
    .then(function(r){return r.json();})
    .then(function(doc){
      clearTimeout(staleTimer);
      if(doc&&doc.fields){
        db=fromFS(doc);
        localStorage.setItem("wh3",JSON.stringify(db));
        cloudBadge("☁️ متزامن","");
      } else {
        loadLocal();
        if(Object.keys(db).length>0)pushCloud();
      }
      showStaleBar(false);
      revealHome();
    })
    .catch(function(){
      clearTimeout(staleTimer);
      loadLocal();
      cloudBadge("📵 محلي","warn");
      showStaleBar(true);
      revealHome();
    });

  window.addEventListener("offline",function(){
    if(!__dataReady){clearTimeout(staleTimer);loadLocal();showStaleBar(true);revealHome();}
  });
}
function loadLocal(){try{db=JSON.parse(localStorage.getItem("wh3")||"{}");}catch(e){db={};}}
function saveDB(){
  localStorage.setItem("wh3",JSON.stringify(db));
  clearTimeout(saveTimer);cloudBadge("⏳ حفظ...","sync");
  saveTimer=setTimeout(pushCloud,1500);
}
function pushCloud(){
  fetch(FB_URL+"?key="+FB_API_KEY,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(toFS(db))})
    .then(function(r){if(r.ok){cloudBadge("☁️ محفوظ","");if(window.__mark)__mark('synced');}else cloudBadge("⚠️ خطأ","warn");})
    .catch(function(){cloudBadge("📵 محلي فقط","warn");});
}

  var inp=document.getElementById("eInp");
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commitEdit();}if(e.key==="Escape")cancelEdit();});
  inp.addEventListener("blur",function(){commitEdit();});
  inp.focus();inp.select();
}
function commitEdit(){
  if(!editInfo)return;
  var inp=document.getElementById("eInp");
  if(!inp){editInfo=null;return;}
  var val=inp.value.trim(),d=getYD(CY);
  if(val!==getName((d.rows[editInfo.col]||[])[editInfo.idx]))pushUndo(val?"تعديل اسم":"مسح اسم");
  if(!d.rows[editInfo.col])d.rows[editInfo.col]=[];
  while(d.rows[editInfo.col].length<=editInfo.idx)d.rows[editInfo.col].push("");
  var oldEntry=d.rows[editInfo.col][editInfo.idx];var oldT=getTime(oldEntry);d.rows[editInfo.col][editInfo.idx]=val?{n:val,t:oldT||Date.now()}:'';
  while(d.rows[editInfo.col].length&&!d.rows[editInfo.col][d.rows[editInfo.col].length-1])d.rows[editInfo.col].pop();
  saveDB();editInfo=null;
  renderTable(document.getElementById("yrSrch").value.trim());renderStats();toast("تم الحفظ ✓","ok");
}
function cancelEdit(){
  if(!editInfo)return;
  var info=editInfo;editInfo=null;
  if(info.prev){info.td.innerHTML='<div class="ci" onclick="startEdit(this,\''+info.col+'\','+info.idx+')">'+info.prev+'<span class="edi">✏️</span></div>';}
  else{info.td.innerHTML='<div class="ci emp" onclick="startEdit(this,\''+info.col+'\','+info.idx+')">—</div>';}
}
function delRow(idx){
  var d=getYD(CY);pushUndo("حذف صف");
  d.cols.forEach(function(c){if((d.rows[c.id]||[]).length>idx)d.rows[c.id].splice(idx,1);});
  saveDB();renderTable(document.getElementById("yrSrch").value.trim());renderStats();showUndoBar("تم حذف الصف");
}

/* ═══ UNDO (يحفظ نسخة قبل كل تعديل، آخر 15 عملية، في ذاكرة الصفحة فقط) ═══ */
var undoStack=[],undoTimer=null;
function pushUndo(label){
  try{undoStack.push({label:label,snap:JSON.stringify(db)});}catch(e){return;}
  if(undoStack.length>15)undoStack.shift();
  refreshUndoUI();
}
function refreshUndoUI(){
  var chip=document.getElementById("undoChip");
  if(!chip)return;
  chip.hidden=!undoStack.length;
  if(undoStack.length)chip.title="تراجع: "+undoStack[undoStack.length-1].label;
}
function showUndoBar(msg){
  var b=document.getElementById("undoBar");
  document.getElementById("undoMsg").textContent="❌ "+msg;
  b.classList.add("on");
  clearTimeout(undoTimer);undoTimer=setTimeout(hideUndoBar,8000);
}
function hideUndoBar(){var b=document.getElementById("undoBar");if(b)b.classList.remove("on");clearTimeout(undoTimer);}
function doUndo(){
  var it=undoStack.pop();
  if(!it)return;
  editInfo=null;
  try{db=JSON.parse(it.snap);}catch(e){toast("تعذر التراجع","er");return;}
  saveDB();hideUndoBar();refreshUndoUI();
  if(CY&&!db[CY]){goHome();}
  else if(CY){renderYearPage();renderTable(document.getElementById("yrSrch").value.trim());}
  else{renderHome();}
  toast("تم التراجع: "+it.label,"ok");
}

/* ═══ DUPLICATE CHECK ═══ */
var dupAck="";
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function normName(s){
  return String(s||"").toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-1632);})
    .replace(/\s+/g," ").trim();
}
function findDups(name){
  var key=normName(name),res=[];
  if(!key||!CY)return res;
  var d=getYD(CY);
  d.cols.forEach(function(c){
    (d.rows[c.id]||[]).forEach(function(en,i){
      var n=getName(en);
      if(n&&normName(n)===key)res.push({name:n,col:c.name,row:i+1});
    });
  });
  return res;
}
function updateDupBox(){
  var inp=document.getElementById("custInp"),box=document.getElementById("dupBox"),btn=document.getElementById("addBtn");
  var name=inp.value.trim(),dups=name?findDups(name):[];
  if(dupAck&&dupAck!==normName(name))dupAck="";
  if(!dups.length){box.className="dup-box";box.innerHTML="";dupAck="";btn.textContent="إضافة ✓";return dups;}
  box.className="dup-box on";
  box.innerHTML="⚠️ هذا الاسم موجود قبل:"+dups.slice(0,3).map(function(x){return "<div>• "+escHtml(x.name)+" — "+escHtml(x.col)+"، صف "+x.row+"</div>";}).join("")+(dups.length>3?"<div>… و"+(dups.length-3)+" أخرى</div>":"");
  btn.textContent="إضافة رغم التكرار";
  return dups;
}
function getLastCol(){try{return localStorage.getItem("wh_lastcol")||"";}catch(e){return "";}}
function setLastCol(c){try{localStorage.setItem("wh_lastcol",c);}catch(e){}}

var modalReady=false;
function openAdd(){
  selC=null;addedCount=0;
  document.getElementById("custInp").value="";
  document.getElementById("addLog").className="added-log";
  var cols=getCols(CY);
  document.getElementById("colPicker").innerHTML=cols.map(function(c,i){
    var bg=COL_COLORS[i%COL_COLORS.length];
    return '<div class="co" data-c="'+c.id+'" onclick="pickC(this)" style="border-color:'+bg+'44">'+c.name+'</div>';
  }).join("");
  var lc=getLastCol();
  if(lc&&cols.some(function(c){return c.id===lc;})){selC=lc;refreshCol();requestAnimationFrame(refreshCol);}
  dupAck="";updateDupBox();
  document.getElementById("addOv").style.display="flex";fitAddOv();
  if(!modalReady){modalReady=true;document.getElementById("addOv").addEventListener("focusin",function(){if(selC)requestAnimationFrame(refreshCol);});}
  setTimeout(function(){document.getElementById("custInp").focus();},50);
}
function closeAdd(){var ov=document.getElementById("addOv");ov.style.display="none";ov.style.top="";ov.style.height="";ov.style.bottom="";}
function fitAddOv(){
  var ov=document.getElementById("addOv"),v=window.visualViewport;
  if(!ov||!v||ov.style.display!=="flex")return;
  ov.style.top=v.offsetTop+"px";ov.style.bottom="auto";ov.style.height=v.height+"px";
}
if(window.visualViewport){window.visualViewport.addEventListener("resize",fitAddOv);window.visualViewport.addEventListener("scroll",fitAddOv);}
function refreshCol(){
  var cols=getCols(CY);
  document.querySelectorAll(".co").forEach(function(o){
    var c=o.getAttribute("data-c"),i=cols.findIndex(function(x){return x.id===c;}),bg=COL_COLORS[i%COL_COLORS.length]||"#888";
    o.className="co";
    if(selC&&c===selC){o.classList.add("sel");o.style.cssText="border-color:"+bg+"!important;background:"+bg+"22!important;color:"+bg+"!important";}
    else{o.style.cssText="border-color:"+bg+"44";}
  });
}
function pickC(el){selC=el.getAttribute("data-c");setLastCol(selC);refreshCol();requestAnimationFrame(refreshCol);document.getElementById("custInp").focus();}
function doAdd(){
  var inp=document.getElementById("custInp"),name=inp.value.trim();
  if(!name){toast("أدخل اسم الزبون","er");inp.focus();return;}
  if(!selC){toast("اختر العمود","er");return;}
  var dups=updateDupBox(),key=normName(name);
  if(dups.length&&dupAck!==key){
    dupAck=key;
    var box=document.getElementById("dupBox");box.classList.remove("flash");void box.offsetWidth;box.classList.add("flash");
    toast("الاسم مكرر — اضغط مرة ثانية للإضافة رغم ذلك","er");inp.focus();return;
  }
  pushUndo("إضافة "+name);
  var d=getYD(CY);
  if(!d.rows[selC])d.rows[selC]=[];
  var entry = {n:name, t:Date.now()};
  d.rows[selC].push(entry);
  setLastCol(selC);
  saveDB();addedCount++;
  var log=document.getElementById("addLog");
  log.className="added-log on";
  log.textContent=addedCount===1?"✅ تمت إضافة: "+name:"✅ آخر إضافة: "+name+" — المجموع "+addedCount;
  inp.value="";updateDupBox();inp.focus();requestAnimationFrame(refreshCol);
  renderTable(document.getElementById("yrSrch").value.trim());renderStats();renderToday();
}

function smartMatch(name,q){if(!q)return true;var w=q.trim().toLowerCase().split(/\s+/).filter(function(x){return x.length>0;});var n=name.toLowerCase();return w.every(function(x){return n.indexOf(x)!==-1;});}
function highlightWords(name,q){
  if(!q) return name;
  var words=q.trim().split(/\s+/).filter(function(w){return w.length>0;});
  var r=name;
  words.forEach(function(w){
    r=r.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  });
  return r;
}
function esc(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\x27");}

function copyToday(){
  var d=getYD(CY),lines=[],total=0;
  var today=new Date();
  lines.push("أُضيفوا اليوم — "+today.getDate()+"/"+(today.getMonth()+1)+"/"+today.getFullYear());
  lines.push("══════════════");
  d.cols.forEach(function(c){
    var names=[];
    (d.rows[c.id]||[]).forEach(function(entry){
      if(isToday(entry))names.push(getName(entry));
    });
    if(names.length){
      lines.push("");
      lines.push("【 "+c.name+" 】");
      names.forEach(function(n,i){lines.push((i+1)+". "+n);});
      total+=names.length;
    }
  });
  if(!total){toast("لا يوجد أسماء اليوم","er");return;}
  var text=lines.join("\n");
  navigator.clipboard.writeText(text).then(function(){
    toast("تم نسخ "+total+" اسم ✓","ok");
  }).catch(function(){
    var ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
    toast("تم نسخ "+total+" اسم ✓","ok");
  });
}

function copyName(name){
  navigator.clipboard.writeText(name).then(function(){
    toast("تم نسخ: "+name,"ok");
  }).catch(function(){
    // fallback
    var ta=document.createElement("textarea");
    ta.value=name;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
    toast("تم نسخ: "+name,"ok");
  });
}

var toastTimer;
function toast(msg,type){var el=document.getElementById("toastEl");el.textContent=(type==="ok"?"✅ ":"❌ ")+msg;el.className="toast on "+(type||"ok");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("on");},3000);}
function toggleExpand(){var card=document.getElementById("tblCard"),btn=document.getElementById("expandBtn");var fs=card.classList.toggle("fullscreen");btn.textContent=fs?"✕":"⛶";btn.title=fs?"تصغير":"تكبير";document.body.style.overflow=fs?"hidden":"";}

document.addEventListener("click",function(e){
  if(!e.target.closest(".srch-box-wrap")){document.getElementById("gAcDrop").classList.remove("on");gAcIdx=-1;}
  if(!e.target.closest(".yr-sbox")){document.getElementById("yrAcDrop").classList.remove("on");yrAcIdx=-1;}
  var addBar=document.getElementById("addYrBar");
  if(addBar.classList.contains("on") && !e.target.closest("#addYrBar") && !e.target.closest('[onclick="toggleAddYr()"]')){
    addBar.classList.remove("on");
  }
  var srchBarEl=document.getElementById("srchBar");
  if(srchBarEl.classList.contains("on") && !e.target.closest("#srchBar") && !e.target.closest('[onclick="toggleSrch()"]')){
    srchBarEl.classList.remove("on");
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(document.getElementById("addOv").style.display==="flex")closeAdd();if(document.getElementById("colOv").style.display==="flex")closeColMgr();if(editInfo)cancelEdit();}});

function importExcel(input){
  var file=input.files[0];if(!file)return;
  var yr=file.name.replace(/\.[^.]+$/,"").replace(/[^0-9]/g,"");
  if(!yr||yr<1900||yr>2100){toast("تأكد إن اسم الملف هو السنة مثل: 2025.xlsx","er");input.value="";return;}
  toast("جارِ تجهيز الاستيراد...","ok");
  loadXLSX().then(function(){doImportExcel(file,yr,input);}).catch(function(){toast("تعذّر تحميل مكتبة الاستيراد — تأكد من الإنترنت","er");input.value="";});
}
function doImportExcel(file,yr,input){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      pushUndo("استيراد Excel");
      var d=getYD(yr),added=0;
      for(var i=1;i<rows.length;i++){
        var row=rows[i];
        d.cols.forEach(function(c,ci){
          var val=(row[ci]||"").toString().trim();
          if(val){if(!d.rows[c.id])d.rows[c.id]=[];d.rows[c.id].push({n:val,t:Date.now()});added++;}
        });
      }
      saveDB();renderHome();
      toast("تم استيراد "+added+" إدخال لسنة "+yr+" ✓","ok");
    }catch(err){toast("فشل القراءة — تأكد إن الملف xlsx صحيح","er");}
    input.value="";
  };
  reader.readAsArrayBuffer(file);
}

<script>

    if(!bar||!btn)return;
    var upd=function(){btn.classList.toggle("active",bar.classList.contains("on"));};

    upd();

  link("addYrBar","bnYr");link("srchBar","bnSrch");
})();

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
/* فحص النسخة: نقارن نسخة الصفحة الشغالة بنسخة السيرفر (meta app-version في أول الملف)، ونظهر زر "يوجد تحديث" فقط لو اختلفت */
var __vc={t:0,ver:"",err:"",n:0},__vcBusy=false;
function showUpdateBtn(){var b=document.getElementById("updBtn");if(b)b.hidden=false;}
function __vcFetch(range){
  var ctl=("AbortController" in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},8000);
  var opt={cache:"no-store"};
  if(range)opt.headers={"Range":"bytes=0-3071"};
  if(ctl)opt.signal=ctl.signal;
  return fetch("index.html?__vcheck="+Date.now(),opt)
    .then(function(r){clearTimeout(to);if(!r.ok&&r.status!==206)throw new Error("HTTP "+r.status);return r.text();})
    .then(function(t){
      var m=t.match(/name="app-version"\s+content="([^"]+)"/)||t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      if(!m)throw new Error("no version");
      return m[1];
    },function(e){clearTimeout(to);throw e;});
}
function checkUpdate(){
  if(__vcBusy||(__vc.t&&Date.now()-__vc.t<4000))return;
  __vcBusy=true;
  __vcFetch(true).catch(function(){return __vcFetch(false);})
    .then(function(v){__vc.ver=v;__vc.err="";if(v!==APP_VERSION)showUpdateBtn();},function(e){__vc.err=String(e&&e.message||e);})
    .then(function(){__vc.t=Date.now();__vc.n++;__vcBusy=false;});
}
function applyUpdate(){
  var b=document.getElementById("updBtn"),tx=document.getElementById("updTxt");
  if(b)b.classList.add("busy");if(tx)tx.textContent="جارٍ التحديث…";
  var go=function(){location.reload();};
  var clear=(window.caches&&caches.keys)?caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("khayyat-shabab")===0;}).map(function(k){return caches.delete(k);}));}):Promise.resolve();
  clear.then(go,go);
  setTimeout(go,4000);
}
setTimeout(checkUpdate,0);
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate();});
window.addEventListener("pageshow",function(e){if(e.persisted)checkUpdate();});
window.addEventListener("online",checkUpdate);
setInterval(function(){if(!document.hidden)checkUpdate();},45000);
</script>
